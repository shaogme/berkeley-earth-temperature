<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球经纬度拾取器 — Premium Edition</title>
    <!-- 引入高科技和现代感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 引入自定义高科技样式 -->
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>

    <div id="info">
        <h3>地球坐标拾取器</h3>
        <div class="subtitle">3D Globe Coordinate Picker</div>
        
        <div id="result-box">
            <div id="result-content" class="placeholder-text">
                请在 3D 地球表面点击拾取坐标
            </div>
        </div>

        <div class="btn-group">
            <button id="copy-btn" class="action-btn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                复制坐标
            </button>
        </div>

        <div class="history-section" id="history-section" style="display: none;">
            <div class="history-title">最近拾取记录</div>
            <ul class="history-list" id="history-list"></ul>
        </div>
    </div>

    <div class="tips">
        <span>左键拖拽旋转地球</span>
        <span>鼠标滚轮缩放视图</span>
        <span>单击表面拾取经纬度</span>
    </div>

    <!-- 引入主应用模块 -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
